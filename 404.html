<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1B5E20" />
  <title>Page not found · Fern</title>
  <style>
    :root { --bg: #f6fbf4; --fg: #14291a; --muted: #4d6454; --accent: #1B5E20; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1a12; --fg: #e4f1e6; --muted: #9db4a2; --accent: #7fd18a; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 440px; }
    h1 { font-size: 64px; margin: 0; color: var(--accent); }
    p { color: var(--muted); margin: 8px 0 24px; }
    a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: var(--bg); text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>That page does not exist. Fern is still here, though.</p>
    <a href="/">Back to Fern</a>
  </main>
</body>
</html>
