name: Export keystore to private backup (one-shot)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "RELEASE_KEYSTORE_BASE64 missing"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > fern-upload.jks
          echo "keystore_bytes=$(wc -c < fern-upload.jks)"
          # Fingerprint only (public) for verification — no private material logged
          if command -v keytool >/dev/null; then
            keytool -list -v -keystore fern-upload.jks -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" -alias "$RELEASE_KEY_ALIAS" 2>/dev/null \
              | grep -E 'SHA256:|Alias name:|Owner:' || true
          fi

      - name: Push to private backup repo
        env:
          EXPORT_TOKEN: ${{ secrets.KEYSTORE_EXPORT_TOKEN }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          git config --global user.name "wized2"
          git config --global user.email "wa0026343@gmail.com"
          rm -rf /tmp/backup
          git clone "https://x-access-token:${EXPORT_TOKEN}@github.com/wized2/fern-signing-backup.git" /tmp/backup
          mkdir -p /tmp/backup/keystore
          cp fern-upload.jks /tmp/backup/keystore/fern-upload.jks
          # store metadata only — passwords in a local-only gitignored style file still in private repo; user needs them for Play
          # Better: write credentials file only in private repo README instructions without printing in logs
          umask 077
          cat > /tmp/backup/keystore/credentials.env << EOF
          RELEASE_KEY_ALIAS=${KEY_ALIAS}
          RELEASE_STORE_PASSWORD=${STORE_PASS}
          RELEASE_KEY_PASSWORD=${KEY_PASS}
          EOF
          # strip leading spaces from heredoc
          sed -i 's/^[[:space:]]*//' /tmp/backup/keystore/credentials.env
          cat > /tmp/backup/README.md << 'EOF'
          # Fern signing backup (PRIVATE)

          For Google Play upload key / local signing.

          - `keystore/fern-upload.jks` — upload keystore
          - `keystore/credentials.env` — alias + passwords (keep private)

          Verify SHA-256 matches:
          `A9:7B:E3:E0:46:0C:DA:E4:58:25:0B:82:61:D6:2B:5A:BF:79:A0:6E:4A:6D:9F:E6:D9:4B:04:DA:FF:51:3E:D2`

          **Do not make this repository public.**
          EOF
          cd /tmp/backup
          git add -A
          git commit -m "Add Fern upload keystore backup for Play Console" || echo "no change"
          git push origin HEAD:main
          echo "Pushed to wized2/fern-signing-backup (private)"
