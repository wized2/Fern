name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug + release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fern-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Fern-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Prepare release assets
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/Fern-release.apk
          cp app/build/outputs/apk/debug/*.apk release-assets/Fern-debug.apk
          ls -la release-assets/

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Fern-release.apk
            release-assets/Fern-debug.apk
          generate_release_notes: true
          body: |
            ## Fern ${{ github.ref_name }}

            Live system pulse for Android — Material 3 green resource monitor.

            - Dual-sample CPU + loadavg fallback
            - Keep-screen-on toggle
            - Battery history sparkline
            - Thermal status (API 29+)
            - Smaller APK (icons-core, packaging excludes, R8)

            **Fern-release.apk** — recommended (minified)
            **Fern-debug.apk** — debug build

            Min SDK 26 · offline · no ads · MIT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create / update latest release (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: Fern v1.3.1
          files: |
            release-assets/Fern-release.apk
            release-assets/Fern-debug.apk
          generate_release_notes: true
          body: |
            ## Fern v1.3.1

            Live system pulse for Android — Material 3 green resource monitor.

            ### What's new
            - Working dual-sample CPU (`/proc/stat` + loadavg fallback)
            - Keep-screen-on toggle
            - Battery history sparkline
            - Thermal status (API 29+)
            - Smaller APK (icons-core, packaging excludes, R8)
            - Settings: theme, refresh, about
            - Bottom tabs: Home · Details · Settings

            ### Downloads
            - **Fern-release.apk** — minified + resource-shrunk (recommended)
            - **Fern-debug.apk** — debug build

            Min SDK 26 · offline · no ads · MIT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
