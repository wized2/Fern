name: Build & Release

# Pull requests: unit tests + debug build + R8 release build of the stable flavor (debug-signed).
# Pushes to main (and v* tags): the same checks, both flavors, signed with the release key, published.

on:
  push:
    branches: [main, beta]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, beta]
    paths-ignore:
      - '**.md'
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Official repo: signing secrets are mandatory (never publish a debug-signed APK).
      # Forks and contributors have no secrets: they get a debug-signed build, as before.
      - name: Decode release keystore
        id: keys
        if: env.IS_RELEASE == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ] || [ -z "${RELEASE_STORE_PASSWORD:-}" ] \
             || [ -z "${RELEASE_KEY_PASSWORD:-}" ] || [ -z "${RELEASE_KEY_ALIAS:-}" ]; then
            if [ "$GITHUB_REPOSITORY" = "wized2/Fern" ]; then
              echo "::error::Release signing secrets are missing. Refusing to publish a debug-signed APK."
              exit 1
            fi
            echo "::warning::No signing secrets in this fork: building with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "Keystore OK: $(wc -c < "$RUNNER_TEMP/release.jks") bytes"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests and debug build
        run: ./gradlew testStableDebugUnitTest assembleStableDebug --stacktrace

      - name: Build release (pull request, stable only)
        if: env.IS_RELEASE != 'true'
        run: ./gradlew assembleStableRelease --stacktrace

      - name: Build release (stable and beta, signed)
        if: env.IS_RELEASE == 'true'
        env:
          # Blank when there is no key (forks): Gradle then falls back to the debug key.
          RELEASE_STORE_FILE: ${{ steps.keys.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleStableRelease assembleBetaRelease --stacktrace

      - name: Verify release signature
        if: env.IS_RELEASE == 'true' && steps.keys.outputs.signed == 'true'
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in app/build/outputs/apk/stable/release/*.apk app/build/outputs/apk/beta/release/*.apk; do
            "$BT/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/verify.txt
            grep -q 'Verified using v2 scheme.*true' /tmp/verify.txt
            if grep -qi 'CN=Android Debug' /tmp/verify.txt; then
              echo "::error::$apk is signed with the Android debug key"
              exit 1
            fi
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fern-debug
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Fern-release
          path: |
            app/build/outputs/apk/stable/release/*.apk
            app/build/outputs/apk/beta/release/*.apk
          if-no-files-found: error

      - name: Keep R8 mapping files
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/*Release/mapping.txt
          if-no-files-found: warn

      - name: Read versionName
        if: env.IS_RELEASE == 'true'
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=v$VN" >> "$GITHUB_OUTPUT"
          echo "Version $VN"

      - name: Prepare release assets
        if: env.IS_RELEASE == 'true'
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/stable/release/*.apk release-assets/Fern-release.apk
          cp app/build/outputs/apk/beta/release/*.apk release-assets/Fern-beta.apk
          ls -la release-assets/

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Fern-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to Pages download/
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          mkdir -p download
          cp release-assets/Fern-release.apk download/Fern-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/Fern-release.apk
          if git diff --staged --quiet; then
            echo "APK unchanged — already on branch"
            exit 0
          fi
          git commit -m "chore: publish site APK for in-page download [skip ci]"
          # Avoid non-fast-forward when another commit landed during the build
          git pull --rebase origin "${{ github.ref_name }}" || {
            echo "rebase failed — retry once"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}" || git rebase --abort || true
          }
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Create / update release (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Fern ${{ steps.ver.outputs.name }}
          files: release-assets/Fern-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
