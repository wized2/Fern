name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true


      - name: Decode release keystore (optional)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ] \
             && [ -n "${RELEASE_KEY_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "path=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Release key secrets not set — release APK will use debug signing (skip)."
          fi

      - name: Build debug + release APKs
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.present == 'true' && format('{0}/release.jks', github.workspace) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/release.jks"
            echo "Signing release with uploaded keystore"
          else
            unset RELEASE_STORE_FILE || true
            echo "No release keystore — Gradle falls back to debug signing"
          fi
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fern-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Fern-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Read versionName
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=v$VN" >> "$GITHUB_OUTPUT"
          echo "Version $VN"

      - name: Prepare release assets
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/Fern-release.apk
          # debug APK stays as workflow artifact only (smaller GitHub Releases; avoids large upload timeouts)
          ls -la release-assets/

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Fern-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Fern ${{ github.ref_name }}

            Live system pulse — Material 3 resource monitor with optional Shizuku/root Advanced mode.

            **Fern-release.apk** — R8 + resource-shrunk

            Min SDK 26 · offline · no ads · MIT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create / update release (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Fern ${{ steps.ver.outputs.name }}
          files: release-assets/Fern-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Fern ${{ steps.ver.outputs.name }}

            Live system pulse — Material 3 resource monitor.

            **Fern-release.apk** — R8 + resource-shrunk (from `main`)

            ### What's new
            - **Advanced mode** (optional): Shizuku or root for thermal zones, per-app RAM/CPU, force-stop
            - Active Apps, Sensors, Hardware details, thermal bar on Home
            - OLED-friendly dark theme · offline · no ads

            **Important (Shizuku):** start Shizuku → allow package `com.endroid.fern` → open Fern → Advanced ON → Grant / Refresh.

            Debug APK is a workflow artifact on this run.

            Min SDK 26 · MIT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
