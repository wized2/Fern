name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true


      - name: Decode release keystore (optional)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ] \
             && [ -n "${RELEASE_KEY_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "path=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Release key secrets not set — release APK will use debug signing (skip)."
          fi

      - name: Build debug + release APKs
        env:
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.present == 'true' && format('{0}/release.jks', github.workspace) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/release.jks"
            echo "Signing release with uploaded keystore"
          else
            unset RELEASE_STORE_FILE || true
            echo "No release keystore — Gradle falls back to debug signing"
          fi
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fern-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Fern-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Read versionName
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=v$VN" >> "$GITHUB_OUTPUT"
          echo "Version $VN"

      - name: Prepare release assets
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/Fern-release.apk
          # debug APK stays as workflow artifact only (smaller GitHub Releases; avoids large upload timeouts)
          ls -la release-assets/

      - name: Load release notes
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        id: notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            {
              echo "body<<FERN_NOTES_EOF"
              cat RELEASE_NOTES.md
              echo "FERN_NOTES_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<FERN_NOTES_EOF"
              echo "## Fern ${{ steps.ver.outputs.name }}"
              echo ""
              echo "See CHANGELOG.md"
              echo "FERN_NOTES_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Fern-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to Pages download/
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          mkdir -p download
          cp release-assets/Fern-release.apk download/Fern-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/Fern-release.apk
          if git diff --staged --quiet; then
            echo "APK unchanged — already on branch"
            exit 0
          fi
          git commit -m "chore: publish site APK for in-page download [skip ci]"
          # Avoid non-fast-forward when another commit landed during the build
          git pull --rebase origin "${{ github.ref_name }}" || {
            echo "rebase failed — retry once"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}" || git rebase --abort || true
          }
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Create / update release (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Fern ${{ steps.ver.outputs.name }}
          files: release-assets/Fern-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
